<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--figma-color-text, #1e1e1e);
      background: var(--figma-color-bg, #ffffff);
    }

    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      background: var(--figma-color-bg, #ffffff);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    p {
      margin: 0 0 20px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--figma-color-text-secondary, #666);
    }

    button {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 6px;
      background: var(--figma-color-bg-brand, #18a0fb);
      color: var(--figma-color-text-onbrand, #ffffff);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--figma-color-bg-brand-hover, #0d8de3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #copy {
      margin-top: 8px;
      background: var(--figma-color-bg-secondary, #f0f0f0);
      color: var(--figma-color-text, #1e1e1e);
    }

    #copy:hover:not(:disabled) {
      background: var(--figma-color-bg-hover, #e5e5e5);
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 16px;
      font-size: 12px;
      line-height: 1.4;
    }

    .success {
      color: var(--figma-color-text-success, #008a4c);
    }

    .error {
      color: var(--figma-color-text-danger, #d92d20);
    }

    .info {
      color: var(--figma-color-text-secondary, #666);
    }
  </style>
</head>

<body>

  <h2>Figma JSON Exporter</h2>

  <p>
    Select one frame in Figma and click the button below
    to export its structure as JSON.
  </p>

  <button id="export">
    Export JSON
  </button>

  <button id="copy" class="hidden">
    Copy JSON to clipboard
  </button>

  <div id="status" class="info">
    Waiting for export...
  </div>

  <script>
    const exportButton = document.getElementById("export");
    const copyButton = document.getElementById("copy");
    const status = document.getElementById("status");

    let lastJsonString = "";

    function setStatus(text, className) {
      status.className = className;
      status.textContent = text;
    }

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      copyButton.classList.add("hidden");
      lastJsonString = "";

      setStatus("Exporting...", "info");

      parent.postMessage(
        {
          pluginMessage: {
            type: "export-request"
          }
        },
        "*"
      );
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(lastJsonString);

        setStatus("JSON copied to clipboard.", "success");
      } catch (error) {
        setStatus(
          "Could not access the clipboard. Open the browser console to copy the logged JSON.",
          "error"
        );

        console.log(lastJsonString);
      }
    });

    function downloadJson(jsonString, fileName) {
      const blob = new Blob([jsonString], {
        type: "application/json"
      });

      const url = URL.createObjectURL(blob);

      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = fileName;
      anchor.rel = "noopener";

      document.body.appendChild(anchor);

      anchor.click();

      // The click starts the download asynchronously, so the object URL and
      // the anchor must outlive this tick or the download is cancelled.
      setTimeout(() => {
        anchor.remove();
        URL.revokeObjectURL(url);
      }, 10000);
    }

    window.onmessage = (event) => {
      const message = event.data && event.data.pluginMessage;

      if (!message) {
        return;
      }

      if (message.type === "error") {
        setStatus(message.message, "error");

        exportButton.disabled = false;

        return;
      }

      if (message.type === "export-result") {
        try {
          lastJsonString = JSON.stringify(message.data, null, 2);

          downloadJson(
            lastJsonString,
            message.fileName || "figma-design.json"
          );

          copyButton.classList.remove("hidden");

          setStatus(
            "Exported " +
              (message.fileName || "figma-design.json") +
              ". If no download appeared, use the copy button above.",
            "success"
          );
        } catch (error) {
          setStatus("Failed to create the JSON file.", "error");
        }

        exportButton.disabled = false;
      }
    };
  </script>

</body>
</html>
